<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- Gilmok has its own dark/light themes: tell Dark Reader-style extensions not to recolor the page -->
<meta name="darkreader-lock">
<title>길목</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238b7cff'/%3E%3Cpath d='M16 7l7 17h-4l-3-8-3 8H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<script src="app.js" defer></script>
<script src="security.js" defer></script>
<script src="proxy.js" defer></script>
<script src="uppicker.js" defer></script>
<script src="groups.js" defer></script>
<script src="config.js" defer></script>
<script src="setup.js" defer></script>
<script src="codeedit.js" defer></script>
<script src="stacks.js" defer></script>
<script src="topology.js" defer></script>
<script src="dashboard.js" defer></script>
<script src="logs.js" defer></script>
<script src="access.js" defer></script>
<script src="accounts.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<!-- 로그인 / 첫 설정 -->
<main id="auth" class="auth" hidden>
  <form id="auth-form" class="glass auth-card" novalidate>
    <div class="brand brand-lg">
      <span class="logo" aria-hidden="true"></span>
      <span>길목</span> <span class="brand-en">Gilmok</span>
    </div>
    <p id="auth-desc" class="muted"></p>
    <div class="field" id="auth-name-wrap">
      <label for="auth-name">아이디</label>
      <input id="auth-name" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="auth-pw">비밀번호</label>
      <input id="auth-pw" type="password" autocomplete="current-password" required minlength="10">
    </div>
    <div class="field" id="auth-pw2-wrap" hidden>
      <label for="auth-pw2">비밀번호 확인</label>
      <input id="auth-pw2" type="password" autocomplete="new-password" minlength="10">
    </div>
    <div class="field" id="auth-code-wrap" hidden>
      <label for="auth-code">2단계 인증 코드</label>
      <input id="auth-code" type="text" autocomplete="one-time-code" maxlength="11" placeholder="앱의 6자리 코드 (또는 복구 코드)">
    </div>
    <p id="auth-err" class="form-error" role="alert" hidden></p>
    <button id="auth-submit" class="btn primary block" type="submit">로그인</button>
    <p class="muted small center" id="auth-ver"></p>
  </form>
</main>

<!-- 앱 -->
<div id="app" class="app" hidden>
  <header class="topbar glass">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>길목</span> <span class="brand-en">Gilmok</span>
    </div>
    <div class="topbar-center" id="pending-area" aria-live="polite"></div>
    <div class="topbar-right">
      <div id="theme-pick" class="theme-pick" role="radiogroup" aria-label="화면 테마 (이 브라우저에만 저장)"></div>
      <button id="me-chip" class="me-chip" type="button" hidden></button>
      <button id="apply-btn" class="btn" type="button">적용…</button>
      <button id="logout-btn" class="icon-btn" type="button" aria-label="로그아웃" title="로그아웃"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="메뉴" id="tabs">
    <button role="tab" id="tab-dashboard" aria-controls="panel" data-tab="dashboard">대시보드</button>
    <button role="tab" id="tab-services" aria-controls="panel" data-tab="services">서비스</button>
    <button role="tab" id="tab-caddy" aria-controls="panel" data-tab="caddy">Caddy</button>
    <button role="tab" id="tab-authelia" aria-controls="panel" data-tab="authelia">Authelia</button>
    <button role="tab" id="tab-cloudflare" aria-controls="panel" data-tab="cloudflare">Cloudflare</button>
    <button role="tab" id="tab-crowdsec" aria-controls="panel" data-tab="crowdsec">CrowdSec</button>
    <button role="tab" id="tab-logs" aria-controls="panel" data-tab="logs">로그</button>
    <button role="tab" id="tab-gilmok" aria-controls="panel" data-tab="gilmok">설정</button>
  </nav>

  <main id="panel" class="panel" role="tabpanel" tabindex="-1"></main>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
