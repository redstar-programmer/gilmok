# Keep the docker-compose.yml attached to the latest release in step with
# deploy/docker-compose.sample.yml (new releases get it from docker.yml).
name: release-assets

on:
  push:
    branches: [main]
    paths: [deploy/docker-compose.sample.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach docker-compose.yml to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          mkdir -p dist && cp deploy/docker-compose.sample.yml dist/docker-compose.yml
          gh release upload "$tag" dist/docker-compose.yml --clobber
          echo "attached to $tag"
