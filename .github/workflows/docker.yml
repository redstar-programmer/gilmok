# Publish the image to Docker Hub (vitive/gilmok) for linux/amd64 and linux/arm64.
#   - push a version tag:  git tag v0.2.0 && git push origin v0.2.0
#       → vitive/gilmok:0.2.0, :0.2, :latest
#   - or run it by hand (Actions › docker › Run workflow) → :edge
# Needs two repository secrets (Settings › Secrets and variables › Actions):
#   DOCKERHUB_USERNAME  the Docker Hub account (vitive)
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write (not the account password)
# A version tag also creates the GitHub release (notes: docs/releases/<tag>.md, else generated) with
# deploy/docker-compose.sample.yml attached as docker-compose.yml.
name: docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# Speed: the image is built while the tests run (two jobs side by side); it is pushed only after both
# succeed — the push re-uses the build cache, so it takes seconds instead of a second full build.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image version   # same build args as the push below, so every layer is a cache hit
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: vitive/gilmok
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push) into the cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: vitive/gilmok
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/setup-qemu-action@v3   # the runtime stage installs packages for each platform
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # same build as the "build" job → served from the cache, then pushed
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist && cp deploy/docker-compose.sample.yml dist/docker-compose.yml
          notes="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # the tag was moved to a newer commit (same version): refresh the asset and the notes
            gh release upload "$TAG" dist/docker-compose.yml --clobber
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/docker-compose.yml --title "Gilmok ${TAG}" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" dist/docker-compose.yml --title "Gilmok ${TAG}" --generate-notes --verify-tag
          fi
